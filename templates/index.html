<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装机助手 · DIY 装机选配与兼容性校验</title>
<!--CSS-->
</head>
<body>

<!--
  注意结构：#modal 与 #toast 必须放在 #app 内部。
  原因：事件委托绑定在 #app 上（见 src/ui/app.js bindEvents），
  若弹窗在 #app 之外，点击事件会在 #app 处停止冒泡，
  弹窗内所有按钮（删除/关闭/重命名/载入）都收不到点击。
-->
<div id="app">
  <div id="storage-warning" hidden></div>
  <div id="stale-banner-slot"></div>
  <header id="topbar"><!--TOPBAR--></header>
  <div id="overview-slot"><!--OVERVIEW--></div>

  <main id="workbench">
    <aside class="panel" id="panel-left"><!--LEFT--></aside>
    <section class="panel" id="panel-center"><!--CENTER--></section>
    <aside class="panel" id="panel-right"><!--RIGHT--></aside>
  </main>

  <!-- 弹窗与提示条置于 #app 内，才能接收到委托事件 -->
  <div id="modal" hidden>
    <div class="modal-box">
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" hidden></div>
</div>

<!--DATA-->
<!--APP-->

</body>
</html>
