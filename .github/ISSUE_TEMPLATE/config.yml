# 这是「新建 Issue」页面的模板选择器配置。
# 文档：https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# 保留「空白 Issue」入口。
# 三个模板（缺陷报告 / 数据纠错 / 功能建议）覆盖了绝大多数情况，GitHub 也会把它们
# 显示在最前面；但总会有「我想问个问题」这类落不进模板的需求，
# 与其逼着用户把问题硬塞进「功能建议」，不如留一个正经的出口。
blank_issues_enabled: true

