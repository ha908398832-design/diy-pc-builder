<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装机助手 · DIY 装机选配与兼容性校验</title>
<style>
/* 装机助手 · 样式
 * 设计依据 PRD 第六部分。颜色统一用 CSS 变量，便于主题调整。
 * 布局：三栏工作台（左品类 240px / 中列表自适应 / 右校验 360px）
 */

:root {
  --bg: #0f1115;
  --bg-2: #161a21;
  --bg-3: #1c2129;
  --bg-hover: #232a34;
  --border: #2a313c;
  --border-2: #3a434f;
  --fg: #e6e9ef;
  --fg-2: #a8b0bd;
  --fg-3: #6f7885;
  --accent: #4f8cff;
  --accent-2: #2f6fdc;

  --error: #ff5d5d;
  --warn: #ffb648;
  --info: #59a5ff;
  --ok: #3fce7c;
  --idle: #6f7885;

  --left-w: 240px;
  --right-w: 360px;
  --radius: 8px;
  --gap: 10px;

  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          "PingFang SC", "Hiragino Sans GB", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  overflow: hidden;
}

button { font-family: inherit; font-size: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: inherit; }

/* ── 整体布局 ─────────────────────────────────────────────────── */

#app {
  display: grid;
  grid-template-rows: auto auto 1fr;
  height: 100vh;
  overflow: hidden;
}

#storage-warning {
  background: #4a3a12;
  color: #ffd479;
  padding: 6px 14px;
  font-size: 12px;
  border-bottom: 1px solid #6b5416;
}

/* ── 顶部栏（PRD 6.3，不含预算）──────────────────────────────── */

#topbar {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}

#topbar .brand {
  font-weight: 700;
  font-size: 15px;
  margin-right: 6px;
  white-space: nowrap;
}

#topbar .spacer { flex: 1; }

.scheme-picker {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.scheme-picker select {
  background: var(--bg-3);
  color: var(--fg);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 4px 6px;
  max-width: 150px;
}

.btn-ghost {
  background: var(--bg-3);
  color: var(--fg-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 5px 9px;
  position: relative;
  white-space: nowrap;
  transition: background .12s, color .12s;
}
.btn-ghost:hover { background: var(--bg-hover); color: var(--fg); }

.btn-primary {
  background: var(--accent-2);
  color: #fff;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 5px 12px;
}
.btn-primary:hover { background: var(--accent); }

.btn-primary:disabled,
.btn-ghost:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.dot {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--warn);
}

/* ── 三栏工作台 ───────────────────────────────────────────────── */

#workbench {
  display: grid;
  grid-template-columns: var(--left-w) minmax(0, 1fr) var(--right-w);
  gap: var(--gap);
  padding: var(--gap);
  overflow: hidden;
  min-height: 0;
}

body.right-collapsed #workbench {
  grid-template-columns: var(--left-w) minmax(0, 1fr) 0;
}
body.right-collapsed #panel-right { display: none; }

.panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-height: 0;
}

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}
.panel-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--fg-2); }

.panel-foot {
  padding: 8px 10px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--fg-2);
  flex: 0 0 auto;
}
.foot-line { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.rule-counts { margin-top: 4px; gap: 8px; justify-content: flex-start; }
.lv-error { color: var(--error); }
.lv-warn { color: var(--warn); }
.lv-info { color: var(--info); }

.muted { color: var(--fg-3); }
.small { font-size: 12px; }

/* ── 左栏品类导航（PRD 6.4）──────────────────────────────────── */

.cat-list { list-style: none; margin: 0; padding: 6px; overflow-y: auto; flex: 1; min-height: 0; }

.cat-item {
  display: grid;
  grid-template-columns: 16px 1fr auto 18px;
  align-items: center;
  gap: 6px;
  padding: 7px 8px;
  border-radius: 6px;
  cursor: pointer;
  border: 1px solid transparent;
}
.cat-item:hover { background: var(--bg-hover); }
.cat-item.is-active { background: var(--bg-3); border-color: var(--accent-2); }
.cat-item.is-empty .cat-value { color: var(--fg-3); }

.cat-mark { color: var(--accent); font-size: 11px; }
.cat-item.is-empty .cat-mark { color: var(--idle); }
.cat-name { font-size: 13px; }
.cat-value {
  font-size: 12px;
  color: var(--fg-2);
  max-width: 96px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.cat-light { text-align: center; font-size: 11px; }

/* ── 中栏：工具条 ─────────────────────────────────────────────── */

.toolbar-main {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex: 0 0 auto;
}
.cat-title { font-weight: 600; font-size: 13px; min-width: 44px; }

.search-input {
  flex: 1;
  min-width: 180px;
  background: var(--bg-3);
  color: var(--fg);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 6px 9px;
}
.search-input:focus { outline: none; border-color: var(--accent); }
.search-input::placeholder { color: var(--fg-3); }

.sort-select {
  background: var(--bg-3);
  color: var(--fg);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 6px;
}

.view-switch { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; }
.vs { background: var(--bg-3); color: var(--fg-2); border: 0; padding: 6px 10px; }
.vs.on { background: var(--accent-2); color: #fff; }

.toolbar-quick {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex: 0 0 auto;
  font-size: 12px;
}
.quick-label { color: var(--fg-3); }
.tag {
  background: var(--bg-3);
  color: var(--fg-2);
  border: 1px solid var(--border-2);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 12px;
}
.tag:hover { background: var(--bg-hover); color: var(--fg); }

.used-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-left: auto;
  color: var(--fg-2);
  cursor: pointer;
}

.list-meta {
  display: flex;
  gap: 12px;
  padding: 5px 10px;
  font-size: 12px;
  color: var(--fg-3);
  border-bottom: 1px solid var(--border);
  flex: 0 0 auto;
}

/* ── 中栏：列表 ───────────────────────────────────────────────── */

.list-wrap { flex: 1 1 auto; overflow: auto; min-height: 120px; }

.hw-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.hw-table thead th {
  position: sticky;
  top: 0;
  background: var(--bg-3);
  color: var(--fg-2);
  text-align: left;
  padding: 7px 8px;
  border-bottom: 1px solid var(--border-2);
  font-weight: 600;
  white-space: nowrap;
  z-index: 1;
}
.hw-table th.num, .hw-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.hw-table th.pick, .hw-table td.pick { width: 30px; text-align: center; }
.hw-table th.ops, .hw-table td.ops { width: 74px; text-align: right; }

.hw-table tbody tr.hw-row:hover { background: var(--bg-hover); }
.hw-table tbody tr.is-selected { background: rgba(79, 140, 255, .12); }
.hw-table tbody tr.is-conflict td.main { color: var(--fg-2); }

.hw-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
.hw-table td.main { font-weight: 500; }

tr.conflict-row td {
  background: rgba(255, 93, 93, .08);
  color: var(--fg-2);
  font-size: 12px;
  padding: 5px 8px 7px 34px;
  border-bottom: 1px solid var(--border);
}
tr.conflict-row[data-level="warn"] td { background: rgba(255, 182, 72, .08); }

.btn-pick {
  background: var(--bg-3);
  color: var(--fg-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 3px 10px;
  font-size: 12px;
}
.btn-pick:hover { background: var(--accent-2); color: #fff; border-color: var(--accent); }
tr.is-selected .btn-pick { background: var(--accent-2); color: #fff; border-color: var(--accent); }

.link {
  background: none;
  border: 0;
  color: var(--accent);
  padding: 0 4px;
  text-decoration: underline;
  font-size: 12px;
}

.badge {
  display: inline-block;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 4px;
  margin-left: 5px;
  vertical-align: middle;
}
.badge-cond { background: #4a3a12; color: #ffd479; }
.badge-custom { background: #1f3d2c; color: #7fe0a8; }

.empty-hint, .empty-hint {
  padding: 26px 16px;
  text-align: center;
  color: var(--fg-3);
}

.guide-card {
  margin: 26px auto;
  max-width: 420px;
  padding: 20px;
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  text-align: center;
}
.guide-card h3 { margin: 0 0 8px; }
.guide-card code {
  background: var(--bg);
  padding: 1px 5px;
  border-radius: 4px;
  font-family: var(--mono);
  font-size: 12px;
}

/* 卡片视图 */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
  gap: 10px;
  padding: 10px;
}
.hw-card {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-radius: var(--radius);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  cursor: pointer;
}
.hw-card:hover { border-color: var(--accent-2); }
.hw-card.is-selected { border-color: var(--accent); background: rgba(79, 140, 255, .1); }
.hw-card.is-conflict { border-color: #6b3a3a; }
.card-title { font-weight: 600; font-size: 13px; }
.card-specs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; font-size: 12px; }
.card-specs .spec { display: flex; justify-content: space-between; gap: 4px; }
.card-specs .spec span { color: var(--fg-3); }
.card-conflict { font-size: 12px; color: var(--fg-2); }
.hw-card .btn-pick { margin-top: auto; }

/* ── 中栏：详情 / 对比（PRD 6.5.4）────────────────────────────── */

.detail-zone {
  flex: 0 0 auto;
  max-height: 44%;
  overflow: auto;
  border-top: 1px solid var(--border-2);
  background: var(--bg-2);
  padding: 10px;
}

.detail-head { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
.detail-head h3 { margin: 0; font-size: 14px; }

.detail-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 4px 14px;
  font-size: 13px;
}
.kv { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--border); padding: 2px 0; }
.kv .k { color: var(--fg-3); }
.kv .v { font-variant-numeric: tabular-nums; }

.detail-notes { margin-top: 8px; font-size: 12px; color: var(--fg-2); }
.detail-conflict {
  margin-top: 8px;
  padding: 7px 9px;
  border-radius: 6px;
  background: rgba(255, 93, 93, .1);
  border: 1px solid #5c2f2f;
  font-size: 12px;
}
.detail-conflict[data-level="warn"] { background: rgba(255, 182, 72, .1); border-color: #5c4a1f; }
.detail-conflict .advice { margin-top: 3px; color: var(--fg-2); }
.detail-ok { margin-top: 8px; font-size: 12px; color: var(--ok); }

.detail-actions { margin-top: 10px; display: flex; gap: 8px; }

.compare-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.compare-head h3 { margin: 0; font-size: 14px; }
.compare-wrap { overflow-x: auto; }
.compare-table { border-collapse: collapse; font-size: 12px; width: 100%; }
.compare-table th, .compare-table td {
  border: 1px solid var(--border);
  padding: 4px 7px;
  text-align: left;
  white-space: nowrap;
}
.compare-table th.k, .compare-table td.k { color: var(--fg-3); font-weight: 400; }
.compare-table th { background: var(--bg-3); }
.compare-table td.diff { background: rgba(79, 140, 255, .14); color: #cfe0ff; font-weight: 600; }
.compare-table tr.row-diff th.k { color: var(--accent); }
.compare-table .compat-row td[data-level="error"] { color: var(--error); }
.compare-table .compat-row td[data-level="warn"] { color: var(--warn); }

/* ── 右栏 ─────────────────────────────────────────────────────── */

#panel-right { overflow-y: auto; }

.compat-counts {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  flex-wrap: wrap;
  flex: 0 0 auto;
}
.cc {
  background: var(--bg-3);
  color: var(--fg-2);
  border: 1px solid var(--border-2);
  border-radius: 6px;
  padding: 3px 8px;
  font-size: 12px;
}
.cc.on { border-color: var(--accent); color: var(--fg); }
.cc[data-filter="error"].on { border-color: var(--error); }
.cc[data-filter="warn"].on { border-color: var(--warn); }

.finding-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; }

.finding {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-left: 3px solid var(--idle);
  border-radius: 6px;
  padding: 8px 9px;
  font-size: 12px;
}
.finding[data-level="error"] { border-left-color: var(--error); }
.finding[data-level="warn"] { border-left-color: var(--warn); }
.finding[data-level="info"] { border-left-color: var(--info); }

.finding-head { display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
.finding-title { font-weight: 600; flex: 1; }
.rule-id {
  background: var(--bg);
  border: 1px solid var(--border-2);
  color: var(--fg-3);
  border-radius: 4px;
  padding: 0 5px;
  font-family: var(--mono);
  font-size: 11px;
}
.rule-id:hover { color: var(--accent); border-color: var(--accent); }

.finding-reason { color: var(--fg-2); }
.finding-advice { margin-top: 4px; color: #9fd0a8; }
.finding-refs { margin-top: 5px; }

.compat-empty { padding: 12px 8px; text-align: center; }
.ok-banner {
  background: rgba(63, 206, 124, .12);
  border: 1px solid #2c5c42;
  color: var(--ok);
  border-radius: 6px;
  padding: 8px;
  margin-bottom: 6px;
  font-size: 13px;
}

.right-divider { height: 1px; background: var(--border-2); margin: 4px 0; flex: 0 0 auto; }

/* 功耗面板 */
.power-body { padding: 8px 10px; font-size: 12px; }
.pw-list { display: flex; flex-direction: column; gap: 3px; }
.pw-row { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
.pw-row .pw-label { color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pw-row .pw-value { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pw-row.strong .pw-label, .pw-row.strong .pw-value { color: var(--fg); font-weight: 600; }

.pw-total { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

.margin-bar {
  position: relative;
  height: 18px;
  margin-top: 8px;
  background: var(--bg);
  border: 1px solid var(--border-2);
  border-radius: 4px;
  overflow: hidden;
}
.margin-fill { height: 100%; background: var(--ok); opacity: .35; }
.margin-bar[data-level="warn"] .margin-fill { background: var(--warn); }
.margin-bar[data-level="error"] .margin-fill { background: var(--error); }
.margin-bar[data-level="info"] .margin-fill { background: var(--info); }
.margin-text {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--fg);
}

.pw-hint { margin-top: 5px; }
.panel-actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ── 弹窗 ─────────────────────────────────────────────────────── */

#modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .62);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
  padding: 24px;
}
#modal[hidden] { display: none; }

.modal-box {
  background: var(--bg-2);
  border: 1px solid var(--border-2);
  border-radius: 10px;
  width: min(920px, 100%);
  max-height: 86vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
}
.modal-head h2 { margin: 0; font-size: 15px; }
#modal-body { padding: 12px 14px; overflow: auto; }

.modal-toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.modal-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
}

.rule-list { display: flex; flex-direction: column; gap: 8px; }
.rule-card {
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  border-left: 3px solid var(--idle);
  border-radius: 6px;
  padding: 9px 11px;
  font-size: 12px;
}
.rule-card[data-level="error"] { border-left-color: var(--error); }
.rule-card[data-level="warn"] { border-left-color: var(--warn); }
.rule-card[data-level="info"] { border-left-color: var(--info); }
.rule-head { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.rule-body { display: flex; flex-direction: column; gap: 3px; color: var(--fg-2); }
.rule-body .k { color: var(--fg-3); }
.rule-body code { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
.rule-body .good { color: #9fd0a8; }
.rule-body .bad { color: #e8a0a0; }

.imp-report { margin: 8px 0; font-size: 12px; }
.imp-summary { display: flex; gap: 14px; margin-bottom: 6px; }
.imp-summary .ok { color: var(--ok); }
.imp-summary .warn { color: var(--warn); }
.imp-report details { margin-top: 5px; }
.imp-report summary { cursor: pointer; color: var(--fg-2); }
.imp-report ul { margin: 4px 0 0 18px; padding: 0; color: var(--fg-3); }

.exp-options { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-bottom: 8px; }
.exp-preview {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 9px;
  max-height: 260px;
  overflow: auto;
}
.exp-preview pre {
  margin: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  white-space: pre-wrap;
  color: var(--fg-2);
}

.scheme-compare { margin-top: 6px; }

/* ── Toast ───────────────────────────────────────────────────── */

#toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: var(--bg-3);
  border: 1px solid var(--border-2);
  color: var(--fg);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  z-index: 80;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5);
}
#toast[hidden] { display: none; }

/* ── 响应式（PRD 6.10）────────────────────────────────────────── */

@media (max-width: 1440px) {
  :root { --left-w: 190px; --right-w: 320px; }
}

@media (max-width: 1100px) {
  #workbench { grid-template-columns: 62px minmax(0, 1fr) var(--right-w); }
  .cat-name, .cat-value { display: none; }
  .cat-item { grid-template-columns: 16px 1fr; justify-items: center; }
  .panel-foot { display: none; }
}

@media (max-width: 860px) {
  #workbench { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto; }
  #panel-left { max-height: 132px; }
  .cat-list { display: flex; gap: 4px; overflow-x: auto; }
  .cat-item { grid-template-columns: auto auto; white-space: nowrap; }
  .cat-name { display: inline; }
  #panel-right { max-height: 320px; }
}

/* 打印：只输出清单视图（PRD 6.10）*/
@media print {
  #topbar, #panel-left, #panel-center .toolbar-main, #panel-center .toolbar-quick,
  #panel-center .list-wrap, #panel-right, #toast { display: none !important; }
  #modal, .modal-box { position: static; background: none; border: 0; max-height: none; }
  .exp-preview { max-height: none; border: 0; }
  body, #app { overflow: visible; height: auto; background: #fff; color: #000; }
  .exp-preview pre { color: #000; }
}

</style>
</head>

</div>

<div id="modal" hidden>

</div>

      return {
        reason: `显卡「${gpu.name}」供电接口不足：${missing.join('；')}。用转接线降级供电有烧毁风险。`,

  {
    id: 'E15',
    level: 'error',
    title: '硬盘接口数量超过主板可用接口',
    categories: ['storage', 'motherboard'],
    required: ['storage', 'motherboard'],
    fields: ['storage.interface', 'motherboard.m2Slots', 'motherboard.sataPorts'],
    good: '2 个 NVMe + 主板 2 个 M.2 口',
    bad: '3 个 NVMe + 主板只有 2 个 M.2 口',
    check({ storage, motherboard }) {
      const list = Array.isArray(storage) ? storage : storage ? [storage] : [];
      if (list.length === 0) return null;

      const nvme = list.filter((s) => s.interface === 'NVMe').length;
      const sata = list.filter((s) => s.interface === 'SATA').length;
      const m2 = n(motherboard.m2Slots) ?? 0;
      const sataPorts = n(motherboard.sataPorts) ?? 0;

      const problems = [];
      if (nvme > m2) problems.push(`NVMe 硬盘 ${nvme} 个，主板只有 ${m2} 个 M.2 接口（差 ${nvme - m2} 个）`);

      return {
        reason: `主板「${motherboard.name}」接口不足：${problems.join('；')}。`,
        advice: '减少硬盘数量、换接口更多的主板，或用 PCIe 转 M.2 扩展卡',

  // ── 🟡 警告（11 条）────────────────────────────────────────────
  {
    id: 'W1',
    level: 'warn',
    title: '电源余量偏低',
    categories: ['psu', 'cpu', 'gpu'],
    required: ['psu', 'cpu'],
    fields: ['power.margin', 'psu.wattage', 'power.peak'],
    good: '峰值 457W + 电源 650W（余量 30%）',

        refs: ref('psu', 'cpu', 'gpu'),
      };

    id: 'W5',
    level: 'warn',
    title: '老芯片组配新 CPU 可能需刷 BIOS',
    categories: ['motherboard', 'cpu'],
    required: ['motherboard', 'cpu'],
    fields: ['motherboard.chipset', 'cpu.socket'],
    good: 'B650 主板 + Ryzen 7000（同期，无需刷）',
    bad: 'B450 主板 + Ryzen 5000（需先刷 BIOS 才能点亮）',
    check({ motherboard, cpu }) {
      const chipset = `${motherboard.chipset || ''}`.trim();
      const entry = BIOS_COMPAT[chipset];

      // 同插槽才谈得上刷 BIOS
      if (motherboard.socket !== cpu.socket) return null;

/** 计算派生列值 */
function cellValue(rec, col) {
  switch (col.key) {
    case '_cores': {
      const pc = rec.pCores ? `${rec.pCores}P` : null;
      const ec = rec.eCores ? `${rec.eCores}E` : null;
      const hybrid = pc || ec ? `${[pc, ec].filter(Boolean).join('+')}/` : '';
      return `${hybrid}${nz(rec.cores)}/${nz(rec.threads)}`;
    }
    case '_clock':
      return rec.baseClock ? `${rec.baseClock}-${rec.boostClock}` : '—';
    case '_igpu':
      return rec.igpu ? '有' : '无';
    case '_formFactors':
      return Array.isArray(rec.formFactors) ? rec.formFactors.join(' ') : '—';
    case '_size':
      if (rec.type === 'aio') return rec.radiatorSize ? `${rec.radiatorSize} 冷排` : '—';
      return rec.height_mm ? `${rec.height_mm}mm` : '—';
    case '_dram':
      return rec.dram ? '有' : '无';
    default: {
      const v = rec[col.key];
      if (Array.isArray(v)) return v.join('; ');
      if (col.key === 'length_mm' || col.key === 'height_mm' || col.key === 'maxGpuLength'
        || col.key === 'maxCoolerHeight' || col.key === 'maxPsuLength') {
        return typeof v === 'number' ? `${v}mm` : '—';
      }
      if (col.key === 'thicknessSlots') return typeof v === 'number' ? `${v}槽` : '—';
      if (col.key === 'maxPower' || col.key === 'tdp' || col.key === 'tdpRating') {
        return typeof v === 'number' ? `${v}W` : '—';
      }
      if (col.key === 'vram' || col.key === 'capacityPerModule') {
        return typeof v === 'number' ? `${v}G` : '—';
      }
      if (col.key === 'capacity') {
        return typeof v === 'number' ? (v >= 1000 ? `${v / 1000}TB` : `${v}GB`) : '—';
      }
      if (col.key === 'wattage') return typeof v === 'number' ? `${v}W` : '—';
      if (col.key === 'speed') return typeof v === 'number' ? `${v}` : '—';
      if (col.key === 'pcie8pin') return typeof v === 'number' ? `×${v}` : '—';
      if (col.key === 'readSpeed') return typeof v === 'number' ? `${v}` : '—';
      if (col.key === 'type') return COOLER_TYPE_LABELS[v] || nz(v);
      return nz(v);
    }
  }
}

/**
 * 渲染表格视图
 *
 * @param {object} o
 * @param {Array}  o.items           当前页记录
 * @param {function} o.checkCandidate (rec) => { level } 行内冲突标记
 * @param {function} o.isSelected     (rec) => boolean
 * @param {Array}  o.compareIds      勾选对比的记录 id
 */
function renderTable({ category, items = [], checkCandidate, isSelected, compareIds = [] }) {
  const cols = TABLE_COLUMNS[category] || [{ key: 'name', label: '型号', main: true }];
  const compareSet = new Set(compareIds);

  const head = cols
    .map((c) => `<th${c.num ? ' class="num"' : ''}>${esc(c.label)}</th>`)
    .join('');

  if (items.length === 0) {
    return `
      <table class="hw-table">
        <thead><tr><th class="pick"></th>${head}<th class="ops">操作</th></tr></thead>
      </table>
      <div class="empty-hint">没有匹配的型号。试试清空搜索或关掉筛选。</div>`;
  }

  const rows = items.map((rec) => {
    const selected = isSelected ? isSelected(rec) : false;
    const check = checkCandidate ? checkCandidate(rec) : { level: 'ok' };
    const conflict = check.level === 'error' || check.level === 'warn';

    const cells = cols.map((c) => {
      const val = cellValue(rec, c);
      if (c.main) {
        const cond = conditionLabel(rec.condition);
        const custom = rec.custom ? '<span class="badge badge-custom">自定义</span>' : '';
        const condBadge = cond ? `<span class="badge badge-cond">${esc(cond)}</span>` : '';
        return `<td class="main">${esc(rec.name)}${condBadge}${custom}</td>`;
      }
      return `<td${c.num ? ' class="num"' : ''}>${esc(val)}</td>`;
    }).join('');

    // 行内冲突提示（PRD 6.5.2：不兼容仍可点选，只在行内说明原因）
    const conflictRow = conflict
      ? `<tr class="conflict-row" data-level="${esc(check.level)}">
           <td colspan="${cols.length + 2}">
             ${LEVEL_ICONS[check.level]} ${esc(check.findings[0]?.reason || '与当前配置存在兼容问题')}
             ${check.findings[0]?.refs?.length
               ? check.findings[0].refs
                   .map((r) => `<button type="button" class="link" data-goto="${esc(r.category)}">查看${esc(CATEGORY_LABELS[r.category] || r.category)}</button>`)
                   .join(' ')
               : ''}
           </td>
         </tr>`
      : '';

    return `
      <tr class="${cls('hw-row', selected && 'is-selected', conflict && 'is-conflict')}"
          data-id="${esc(rec.id)}" data-level="${esc(check.level)}">
        <td class="pick">
          <input type="checkbox" data-compare="${esc(rec.id)}"${compareSet.has(rec.id) ? ' checked' : ''}
                 aria-label="加入对比">
        </td>
        ${cells}
        <td class="ops">
          <button type="button" class="btn-pick" data-pick="${esc(rec.id)}">
            ${selected ? '已选' : '选它'}
          </button>
        </td>
      </tr>${conflictRow}`;
  }).join('');

  return `
    <table class="hw-table">
      <thead><tr><th class="pick"></th>${head}<th class="ops">操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

/** 渲染卡片视图 */
function renderCards({ category, items = [], checkCandidate, isSelected }) {
  if (items.length === 0) {
    return '<div class="empty-hint">没有匹配的型号。</div>';
  }
  const cols = (TABLE_COLUMNS[category] || []).slice(0, 5);

  return `<div class="card-grid">${items.map((rec) => {
    const selected = isSelected ? isSelected(rec) : false;
    const check = checkCandidate ? checkCandidate(rec) : { level: 'ok' };
    const conflict = check.level === 'error' || check.level === 'warn';
    const cond = conditionLabel(rec.condition);

    const specs = cols.slice(1).map((c) => `
      <div class="spec"><span>${esc(c.label)}</span><b>${esc(cellValue(rec, c))}</b></div>`).join('');

    return `
      <div class="${cls('hw-card', selected && 'is-selected', conflict && 'is-conflict')}"
           data-id="${esc(rec.id)}" data-level="${esc(check.level)}">
        <div class="card-title">
          ${esc(rec.name)}
          ${cond ? `<span class="badge badge-cond">${esc(cond)}</span>` : ''}
          ${rec.custom ? '<span class="badge badge-custom">自定义</span>' : ''}
        </div>
        <div class="card-specs">${specs}</div>
        ${conflict ? `<div class="card-conflict">${LEVEL_ICONS[check.level]} ${esc(check.findings[0]?.reason || '')}</div>` : ''}
        <button type="button" class="btn-pick" data-pick="${esc(rec.id)}">${selected ? '已选' : '选它'}</button>
      </div>`;
  }).join('')}</div>`;
}

/** 格式化详情值（含单位与近似标记） */
function detailValue(rec, key) {
  const v = rec[key];
  if (v === undefined || v === null || v === '') return '—';

  const approx = Array.isArray(rec.estimated) && rec.estimated.includes(key) ? '≈' : '';

  if (Array.isArray(v)) return `${approx}${v.join(' / ')}`;
  if (typeof v === 'boolean') return v ? '是' : '否';

  const unitMap = {
    baseClock: ' GHz', boostClock: ' GHz', l3Cache: ' MB', tdp: ' W', maxPower: ' W',
    maxMemorySpeed: ' MT/s', maxMemory: ' GB', length_mm: ' mm', width_mm: ' mm',
    height_mm: ' mm', maxGpuLength: ' mm', maxGpuThickness: ' 槽', maxCoolerHeight: ' mm',
    maxPsuLength: ' mm', vram: ' GB', busWidth: ' bit', capacityPerModule: ' GB',
    modules: ' 条', speed: ' MT/s', wattage: ' W', volume: ' L', tdpRating: ' W',
    noise_dba: ' dBA', ramClearance_mm: ' mm', thickness_mm: ' mm', capacity: ' GB',
    readSpeed: ' MB/s', writeSpeed: ' MB/s', tbw: ' TBW', fanMounts: ' 个',
    radiatorSize: '', year: ' 年', warranty: ' 年', pcie8pin: ' 个', pcie12vhpwr: ' 个',
    eps8pin: ' 个', sataPorts: ' 个', m2Slots: ' 个', memorySlots: ' 个',
    cpuPowerConnectors: ' 个', vrmPhases: ' 相', expansionSlots: ' 个',
    sataConnectors: ' 个', fanCount: ' 个', pcieX16Slots: ' 个', driveBays35: ' 个',
    driveBays25: ' 个', capacityPerModule_g: '',
  };
  const unit = unitMap[key] ?? '';
  return `${approx}${v}${unit}`;
}

 * @param {object} o
 * @param {object} o.record
 * @param {object} o.candidateCheck 该型号对当前配置的兼容结论
 */
function renderDetail({ category, record, candidateCheck }) {
  if (!record) {
    return `
      <div class="detail-head"><h3>参数详情</h3></div>
      <div class="empty-hint">单击上方的型号行查看完整参数；勾选 2~4 个可并排对比。</div>`;
  }

  const keys = DETAIL_FIELDS[category] || Object.keys(record).filter((k) => !['id', 'category', 'aliases', 'custom', 'estimated'].includes(k));
  const rows = keys
    .filter((k) => record[k] !== undefined && record[k] !== null && record[k] !== '')
    .map((k) => `
      <div class="kv">
        <span class="k">${esc(FIELD_LABELS[k] || k)}</span>

    openModal('方案对比', '<div class="empty-hint">至少需要保存 2 套方案才能对比。先选好一套配置点「💾保存」。</div>');
    return;
  }
  const a = names[0];
  const b = names[1];
  const byId = indexAll();
  const rows = [];
  for (const cat of CATEGORY_ORDER) {
    const idA = (store.state.schemes[a].config || {})[cat];
    const idB = (store.state.schemes[b].config || {})[cat];
    const recA = cat === 'storage'
      ? (Array.isArray(idA) ? idA : []).map((x) => byId.get(x)).filter(Boolean)[0]
      : byId.get(idA);
    const recB = cat === 'storage'
      ? (Array.isArray(idB) ? idB : []).map((x) => byId.get(x)).filter(Boolean)[0]
      : byId.get(idB);
    const same = (recA?.id || null) === (recB?.id || null);
    rows.push(`
      <tr class="${same ? '' : 'row-diff'}">
        <th class="k">${CATEGORY_LABELS[cat]}</th>
        <td>${recA ? escapeHtml(recA.name) : '未选'}</td>
        <td>${recB ? escapeHtml(recB.name) : '未选'}</td>
        <td>${same ? '相同' : '不同'}</td>
      </tr>`);
  }

  // 各自跑一次兼容性与功耗
  const stat = (name) => {
    const cfg = store.state.schemes[name].config || {};
    const res = checkCompatibility({ config: cfg, byId });
    return { res };
  };
  const sa = stat(a);
  const sb = stat(b);

  openModal('方案对比', `
    <div class="modal-toolbar">
      <label>左：<select id="cmp-left">${names.map((n) => `<option${n === a ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select></label>
      <label>右：<select id="cmp-right">${names.map((n) => `<option${n === b ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select></label>
    </div>
    <table class="compare-table scheme-compare">
      <thead><tr><th class="k">部件</th><th>${escapeHtml(a)}</th><th>${escapeHtml(b)}</th><th>差异</th></tr></thead>
      <tbody>
        ${rows.join('')}
        <tr class="compat-row">
          <th class="k">兼容性</th>
          <td>🔴${sa.res.counts.error} 🟡${sa.res.counts.warn}</td>
          <td>🔴${sb.res.counts.error} 🟡${sb.res.counts.warn}</td>
          <td>—</td>
        </tr>
        <tr class="compat-row">
          <th class="k">功耗</th>
          <td>${sa.res.power.peak}W / ${sa.res.power.psuWattage ?? '未选'}W</td>
          <td>${sb.res.power.peak}W / ${sb.res.power.psuWattage ?? '未选'}W</td>
          <td>—</td>
        </tr>
      </tbody>
    </table>`);
}

/** 导出（M9） */
function openExport() {
  const d = derive();
  openModal('导出清单', `
    <div class="modal-toolbar">
      <label>格式：
        <select id="exp-format">
          <option value="xlsx">表格 (.xlsx)</option>
          <option value="csv">CSV（Excel 可直接打开）</option>
          <option value="text">纯文本</option>
        </select>
      </label>
    </div>
    <div class="exp-options">
      <label><input type="checkbox" id="exp-params" checked> 关键参数摘要</label>
      <label><input type="checkbox" id="exp-notes" checked> 兼容性备注</label>
      <label><input type="checkbox" id="exp-used"> 二手风险提示</label>
    </div>
    <div class="exp-preview" id="exp-preview"></div>
    <div class="modal-actions">
      <button type="button" class="btn-primary" id="exp-do">导出</button>
      <button type="button" class="btn-ghost" data-action="modal-close">取消</button>
    </div>`);

  const preview = () => {
    const fmt = $('#exp-format').value;
    const opts = {
      includeParams: $('#exp-params').checked,
      includeNotes: $('#exp-notes').checked,
      includeUsedWarning: $('#exp-used').checked,
      format: fmt,
    };
    const out = buildExport(d.resolved, d.result, opts);
    $('#exp-preview').innerHTML = `<pre>${escapeHtml(out.preview)}</pre>`;
    return out;
  };

  preview();
  for (const id of ['exp-format', 'exp-params', 'exp-notes', 'exp-used']) {
    $(`#${id}`).addEventListener('change', preview);
  }
  $('#exp-do').addEventListener('click', () => {
    const out = preview();
    downloadBlob(out.filename, out.blob);
    toast(`已导出 ${out.filename}`);
  });
}

/** CSV 导入（M2） */
function openImport() {
  openModal('导入硬件数据', `
    <div class="modal-toolbar">
      <label>1️⃣ 品类：
        <select id="imp-cat">
          ${CATEGORY_ORDER.map((c) => `<option value="${c}">${CATEGORY_LABELS[c]}</option>`).join('')}
        </select>
      </label>
      <label>2️⃣ 文件：<input type="file" id="imp-file" accept=".csv,text/csv"></label>
      <button type="button" class="btn-ghost" id="imp-template">下载空白模板</button>
    </div>
    <div id="imp-report" class="imp-report"><div class="empty-hint">选择 CSV 文件后在这里显示校验报告。</div></div>
    <div class="modal-actions">
      <span class="muted">重名处理：</span>
      <label><input type="radio" name="imp-dup" value="skip" checked> 跳过</label>
      <label><input type="radio" name="imp-dup" value="overwrite"> 覆盖</label>
      <label><input type="radio" name="imp-dup" value="keep-both"> 并存</label>
      <button type="button" class="btn-primary" id="imp-do" disabled>确认导入</button>
      <button type="button" class="btn-ghost" data-action="modal-close">取消</button>
    </div>`);

  let pending = null;

  $('#imp-template').addEventListener('click', () => {
    const cat = $('#imp-cat').value;
    const csv = buildTemplateCsv(cat);
    downloadBlob(`${cat}-模板.csv`, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  });

  $('#imp-file').addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    const cat = $('#imp-cat').value;
    const text = await file.text();
    const existing = listOf(cat).filter((r) => !r.custom);
    const report = buildImportReport(text, cat, existing);
    pending = { cat, report };

    const dup = report.duplicates.length;
    $('#imp-report').innerHTML = `
      <div class="imp-summary">
        <div class="ok">✅ 可用 ${report.summary.valid} 条</div>
        <div class="warn">⚠ 非法 ${report.summary.invalid} 条（将跳过）</div>
        <div class="warn">⚠ 重名 ${dup} 条</div>
      </div>
      ${report.invalid.length ? `<details><summary>查看非法明细</summary><ul>${report.invalid.map((i) => `<li>第 ${i.row} 行：${escapeHtml(i.errors.join('；'))}</li>`).join('')}</ul></details>` : ''}
      ${dup ? `<details><summary>查看重名明细</summary><ul>${report.duplicates.map((i) => `<li>第 ${i.row} 行：${escapeHtml(i.id)}${i.inFile ? '（文件内重复）' : '（与现有型号同名）'}</li>`).join('')}</ul></details>` : ''}
      ${report.warnings.length ? `<div class="muted small">${escapeHtml(report.warnings.join('；'))}</div>` : ''}`;
    $('#imp-do').disabled = report.summary.valid + dup === 0;
  });

  $('#imp-do').addEventListener('click', () => {
    if (!pending) return;
    const strategy = document.querySelector('input[name="imp-dup"]:checked')?.value || 'skip';
    const { cat, report } = pending;
    const existing = listOf(cat).filter((r) => !r.custom);
    const merged = mergeRecords(existing, report, strategy);
    store.setCustom(cat, merged.merged.filter((r) => r.custom));
    closeModal();
    toast(`已导入 ${merged.added} 条（覆盖 ${merged.overwritten}、跳过 ${merged.skipped}、并存 ${merged.renamed}）`);
  });
}

function powerDetailText() {
  const d = derive();
  const p = d.result.power;
  const lines = p.breakdown.map((b) => `${b.label}：${b.watts}W\n    ${b.basis}`);
  lines.push('', `整机峰值：${p.peak}W`, `建议电源：≥${p.recommendedPsu}W（峰值 ×1.4 向上取 50W 档）`);
  if (p.psuWattage !== null) lines.push(`当前电源：${p.psuWattage}W，余量 ${p.margin}%`);
  return lines.join('\n');
}

function escapeHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

let toastTimer = null;
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.hidden = false;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2000);
}
